# This workflow builds the PortalWeb application and deploys the backend to Railway.
# The frontend deploys automatically to Vercel via its native GitHub integration.
#
# To configure backend deployment:
# 1. Add a RAILWAY_TOKEN secret to this repository.
#    Obtain it from your Railway project settings (Account Settings > Tokens).
# 2. Optionally set RAILWAY_SERVICE_ID to target a specific service.

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: npm install, build, and test
      run: |
        npm install
        npm run build --if-present
        npm run test --if-present

    - name: Upload artifact for deployment job
      uses: actions/upload-artifact@v4
      with:
        name: node-app
        path: .

  deploy:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Development'

    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: node-app

    - name: Deploy backend to Railway
      if: ${{ secrets.RAILWAY_TOKEN != '' }}
      run: |
        npm install -g @railway/cli
        railway up
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
